version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, app]
    groups:
      androidx: { patterns: ["androidx.*", "org.jetbrains.kotlin*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies, ci]
